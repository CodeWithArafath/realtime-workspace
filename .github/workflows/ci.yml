name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Server
        working-directory: server
        run: npm install

      - name: Build Server
        working-directory: server
        run: npm run build