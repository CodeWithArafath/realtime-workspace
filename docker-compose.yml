services:

  mongodb:
    image: mongo
    container_name: workspace-mongodb
    ports:
      - "27017:27017"

  redis:
    image: redis
    container_name: workspace-redis
    ports:
      - "6379:6379"

  server:
    build: ./server
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - redis

  client:
    build: ./client
    ports:
      - "5173:5173"
    depends_on:
      - server